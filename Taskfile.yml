# yaml-language-server: $schema=https://taskfile.dev/schema.json
# https://taskfile.dev
version: '3'
vars:
  MAIN: cmd/main.go
  BIN_DIR: ~/.local/bin
  EXECUTABLE: tm
  VERSION: dev
tasks:
  default:
    cmd: go run {{.MAIN}} {{.CLI_ARGS}}
    silent: true
  build:
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -ldflags="-s -w -X edsonjaramillo/tm/internal/cli.Version={{.VERSION}}" -o {{.BIN_DIR}}/{{.EXECUTABLE}} {{.MAIN}}
    silent: true
  test:
    cmd: go test ./...
    silent: true
  format:
    cmd: gofumpt -w .
    silent: true
  lint:
    cmd: golangci-lint run ./...
    silent: true
  start:
    cmd: go run {{.MAIN}} start {{.CLI_ARGS}}
    silent: true
  detach:
    cmd: go run {{.MAIN}} detach {{.CLI_ARGS}}
    silent: true
  editor:
    cmd: go run {{.MAIN}} editor {{.CLI_ARGS}}
    silent: true
  opencode:
    cmd: go run {{.MAIN}} opencode {{.CLI_ARGS}}
    silent: true
  claude:
    cmd: go run {{.MAIN}} claude {{.CLI_ARGS}}
    silent: true
  codex:
    cmd: go run {{.MAIN}} codex {{.CLI_ARGS}}
    silent: true
  quads:
    cmd: go run {{.MAIN}} quads {{.CLI_ARGS}}
    silent: true
  dual:
    cmd: go run {{.MAIN}} dual {{.CLI_ARGS}}
    silent: true
  git:
    cmd: go run {{.MAIN}} git {{.CLI_ARGS}}
    silent: true
  kill-all:
    cmd: go run {{.MAIN}} kill --all {{.CLI_ARGS}}
    silent: true
  release-tag:
    cmd: bash scripts/release-tag.sh {{.CLI_ARGS}}
    silent: true
  install-script:
    cmd: bash scripts/install.sh {{.CLI_ARGS}}
    silent: true
